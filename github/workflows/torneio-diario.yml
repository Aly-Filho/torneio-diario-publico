# Torneio diário no GitHub Actions (ver torneio/DIARIO.md).
#
# Este ficheiro vive num repositório PÚBLICO do GitHub, em .github/workflows/torneio-diario.yml.
# Aqui no GitLab fica só uma cópia de referência. Todos os dias, o GitHub liga uma máquina,
# faz clone do projeto do GitLab, corre torneio/diario.sh (torneio + testes do play.py)
# e faz push do campeão e do histórico de volta para o main do GitLab.
#
# Como o repositório é público, os logs e os artifacts podem ser vistos por qualquer pessoa:
# - o log só mostra o estado (correu bem / falhou e porquê), sem classificação nem código;
# - o log completo e os CSVs dos jogos vão num artifact cifrado com ARTIFACT_PASS.
#
# No repositório do GitHub (Settings → Secrets and variables → Actions):
#   Secrets:   TORNEIO_TOKEN (token do GitLab com write_repository e papel Maintainer)
#              ARTIFACT_PASS (palavra-passe para cifrar os resultados)
#   Variables: GITLAB_HOST (gitlab.up.pt) e GITLAB_PROJECT (caminho do projeto no GitLab)

name: Torneio diário

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC (02:00 em Lisboa no inverno, 03:00 no verão)
  workflow_dispatch:       # botão "Run workflow" para correr à mão
    inputs:
      jogos:
        description: "Número de jogos"
        required: false
        default: "12"

# O workflow não escreve nada no GitHub: o GITHUB_TOKEN fica sem permissões.
permissions: {}

env:
  GITLAB_HOST: ${{ vars.GITLAB_HOST }}
  GITLAB_PROJECT: ${{ vars.GITLAB_PROJECT }}
  TZ: Europe/Lisbon

jobs:
  torneio:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Clonar o projeto do GitLab
        env:
          TORNEIO_TOKEN: ${{ secrets.TORNEIO_TOKEN }}
        run: |
          : "${GITLAB_HOST:?falta a variable GITLAB_HOST}" "${GITLAB_PROJECT:?falta a variable GITLAB_PROJECT}"
          git clone --quiet "https://oauth2:${TORNEIO_TOKEN}@${GITLAB_HOST}/${GITLAB_PROJECT}.git" tp2

      - name: Python 3.13 (o mesmo da competição)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: pip install --quiet numpy scipy pytest

      - name: Torneio, testes do play.py e push do campeão
        working-directory: tp2
        env:
          TORNEIO_TOKEN: ${{ secrets.TORNEIO_TOKEN }}
          TORNEIO_JOGOS: ${{ inputs.jogos || '12' }}
          CI_SERVER_HOST: ${{ env.GITLAB_HOST }}
          CI_PROJECT_PATH: ${{ env.GITLAB_PROJECT }}
        run: |
          # O output completo (classificação, nomes, tracebacks) fica só no artifact cifrado.
          status=0
          bash torneio/diario.sh > "${RUNNER_TEMP}/torneio.log" 2>&1 || status=$?
          echo "Núcleos: $(nproc) · jogos: ${TORNEIO_JOGOS}"
          # Só mensagens de estado e de erro do git, para se perceber o que correu mal.
          grep -E "^Push feito|^Nada mudou|^O main mudou|^Não consegui|vencedor rejeitado|Access denied|Authentication failed|not allowed|403|^fatal:" \
            "${RUNNER_TEMP}/torneio.log" | sed -E 's/: (Torneio diário [0-9-]+): .*/: \1/' || true
          if [ "${status}" -ne 0 ]; then
            echo "O torneio falhou (código ${status}). O log completo está no artifact cifrado."
          fi
          exit "${status}"

      - name: Cifrar os resultados
        if: always()
        env:
          ARTIFACT_PASS: ${{ secrets.ARTIFACT_PASS }}
        run: |
          : "${ARTIFACT_PASS:?falta o segredo ARTIFACT_PASS}"
          mkdir -p tp2/arena/results
          cp "${RUNNER_TEMP}/torneio.log" tp2/arena/results/ 2>/dev/null || true
          tar czf - -C tp2 arena/results \
            | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
                  --passphrase "${ARTIFACT_PASS}" -o resultados.tar.gz.gpg

      - name: Guardar os resultados cifrados (30 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-torneio
          path: resultados.tar.gz.gpg
          if-no-files-found: ignore
          retention-days: 30
