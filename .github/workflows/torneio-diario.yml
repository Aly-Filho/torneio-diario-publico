# Torneio diário no GitHub Actions (ver torneio/DIARIO.md).
#
# Este ficheiro vive num repositório PÚBLICO do GitHub, em .github/workflows/torneio-diario.yml.
# Aqui no GitLab fica só uma cópia de referência. Todos os dias, o GitHub liga uma máquina,
# faz clone do projeto do GitLab, corre torneio/diario.sh (torneio + testes do play.py)
# e faz push do campeão e do histórico de volta para o main do GitLab.
#
# Como o repositório é público, os logs podem ser vistos por qualquer pessoa: o log só mostra
# o andamento de cada jogo e o estado (correu bem / falhou e porquê), sem classificação, nomes
# nem código. Não se guardam artifacts no GitHub: o relatório completo de cada torneio, com o
# detalhe jogo a jogo, fica no GitLab, em torneio/resultados/.
#
# No repositório do GitHub (Settings → Secrets and variables → Actions):
#   Secrets:   TORNEIO_TOKEN (token do GitLab com write_repository e papel Maintainer)
#   Variables: GITLAB_HOST (gitlab.up.pt) e GITLAB_PROJECT (caminho do projeto no GitLab)

name: Torneio diário

on:
  schedule:
    - cron: "0 22 * * *"  # 22:00 UTC (22:00 em Lisboa no inverno, 23:00 no verão)
  workflow_dispatch:       # botão "Run workflow" para correr à mão
    inputs:
      jogos:
        description: "Número de jogos"
        required: false
        default: "40"

# O workflow não escreve nada no GitHub: o GITHUB_TOKEN fica sem permissões.
permissions: {}

env:
  GITLAB_HOST: ${{ vars.GITLAB_HOST }}
  GITLAB_PROJECT: ${{ vars.GITLAB_PROJECT }}
  TZ: Europe/Lisbon

jobs:
  torneio:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Clonar o projeto do GitLab
        env:
          TORNEIO_TOKEN: ${{ secrets.TORNEIO_TOKEN }}
        run: |
          : "${GITLAB_HOST:?falta a variable GITLAB_HOST}" "${GITLAB_PROJECT:?falta a variable GITLAB_PROJECT}"
          git clone --quiet "https://oauth2:${TORNEIO_TOKEN}@${GITLAB_HOST}/${GITLAB_PROJECT}.git" tp2

      - name: Python 3.13 (o mesmo da competição)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: pip install --quiet numpy scipy pytest

      - name: Torneio, testes do play.py e push do campeão
        working-directory: tp2
        env:
          TORNEIO_TOKEN: ${{ secrets.TORNEIO_TOKEN }}
          TORNEIO_JOGOS: ${{ inputs.jogos || '40' }}
          CI_SERVER_HOST: ${{ env.GITLAB_HOST }}
          CI_PROJECT_PATH: ${{ env.GITLAB_PROJECT }}
        run: |
          # O log é público: só passam as linhas desta lista (progresso de cada jogo, estado
          # e erros do git), à medida que aparecem, e sem nomes. A classificação, os nomes
          # e os tracebacks ficam de fora; o detalhe de cada jogo vai para o relatório no GitLab.
          bash torneio/diario.sh 2>&1 \
          | grep --line-buffered -E \
              "^Núcleos disponíveis|^[0-9]+ jogos · |^  ▶ jogo seed|^  · jogo seed|^  ✔ [0-9]+/[0-9]+ jogos|^  [0-9]+ jogos em |^A testar o play\.py|^✓ Os testes do play\.py|^✗ .* falhou nos testes|^Ninguém inscrito|^O torneio não terminou|^Push feito|^Nada mudou|^O main mudou|^Não consegui|^(remote|fatal|error):|falta a variável" \
          | sed -u -E \
              -e '/^  · jogo seed/s/ \([^)]*\)//' \
              -e 's/^✗ .* ganhou mas falhou nos testes.*/✗ O vencedor falhou nos testes do play.py: o campeão anterior mantém-se./' \
              -e 's/^(Push feito: Torneio diário [0-9-]+): (vencedor rejeitado nos testes).*/\1: \2/' \
              -e 's/^(Push feito: Torneio diário [0-9-]+): campeão .*/\1/' \
          ; status=${PIPESTATUS[0]}
          if [ "${status}" -ne 0 ]; then
            echo "O torneio falhou (código ${status}). Corre no PC para ver o detalhe (ver torneio/DIARIO.md)."
          fi
          exit "${status}"

